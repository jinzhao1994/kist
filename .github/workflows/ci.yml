name: CI

# Both events, even though only push fires today: the repo is private and
# development happens directly on main. When it goes public and switches to a
# PR flow, this workflow needs no change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded push has nothing to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The full gate. gofmt, tidiness and vet are platform-independent, so they
  # run once, here.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Reading the version from go.mod means CI and the local toolchain
          # cannot drift apart.
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci

      # Identical to what `make check` runs locally. Keep it that way: the
      # point of the Makefile is that the red X never appears in the first
      # place.
      - name: Install media tools for integration tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg libheif-examples libheif-plugin-libde265 libreoffice-writer libreoffice-impress

      - run: make check

  # Tests only, on the platforms `check` does not cover. The storage layer is
  # where platforms diverge — link farm capability detection, path limits,
  # 0444, fsync and atomic rename — and that divergence has to fail here, not
  # at release time.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci

      - run: npm --prefix web run build

      # Not `make check`: GNU make is not guaranteed on the Windows runner, and
      # the checks worth repeating per platform are these two. No -race here —
      # it needs a C toolchain on Windows; `check` covers it on Linux.
      - shell: bash
        run: |
          # Use the same package deadline as make check; the durable SQLite
          # suite can exceed Go's implicit 10-minute deadline on Windows.
          go_test_timeout=$(sed -n 's/^GO_TEST_TIMEOUT ?= //p' Makefile)
          test -n "$go_test_timeout"
          go test -timeout="$go_test_timeout" ./...
          CGO_ENABLED=0 go build ./...

  container:
    name: container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      EXPECTED_PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Assert native execution so a runner change cannot silently introduce emulation.
      - name: Check runner architecture
        run: |
          case "$RUNNER_ARCH" in
            X64) actual=linux/amd64 ;;
            ARM64) actual=linux/arm64 ;;
            *) echo "Unexpected runner architecture: $RUNNER_ARCH"; exit 1 ;;
          esac
          test "$actual" = "$EXPECTED_PLATFORM"
      - name: Build the native runtime image
        run: docker buildx build --load --pull --no-cache-filter runtime --platform "$EXPECTED_PLATFORM" -t kist:ci .
      - name: Exercise media, access checks and persistence
        run: sh scripts/docker-smoke.sh kist:ci "$EXPECTED_PLATFORM"
      - run: python3 scripts/check-compose.py
