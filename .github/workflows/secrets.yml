name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Use the trusted base policy for pull requests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git show "$BASE_SHA:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
          else
            cp .gitleaks.toml "$RUNNER_TEMP/gitleaks.toml"
          fi
      - name: Scan full reachable history
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts='--all --full-history' \
            --config "$RUNNER_TEMP/gitleaks.toml" --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore-file" --redact=100 --no-banner .
