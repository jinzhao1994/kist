name: Release

# Cross-compiling four platforms on every commit is slow and wastes quota, and
# four-platform artifacts are only needed at release time. workflow_dispatch is
# here so the pipeline can be exercised without cutting a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci

      - name: Check the release source
        run: make check

      # On a tag, github.ref_name is the tag itself. On workflow_dispatch it is
      # the branch, so VERSION stays empty and the binary honestly reports
      # "dev".
      - name: Cross-compile
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            make dist VERSION="$REF_NAME"
          else
            make dist
          fi

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # CI already ran the tests per platform, but from source, built on the host.
  # This runs the artifact we are about to hand to users, on the platform we
  # claim it runs on. These four runners cover exactly the four targets.
  smoke:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: kist_linux_amd64
            platform: linux/amd64
          - runner: macos-15-intel # explicit Intel runner; macos-13 is retired
            binary: kist_darwin_amd64
            platform: darwin/amd64
          - runner: macos-latest # arm64
            binary: kist_darwin_arm64
            platform: darwin/arm64
          - runner: windows-latest
            binary: kist_windows_amd64.exe
            platform: windows/amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Verify and exercise the actual artifact
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=dev
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          python scripts/release-smoke.py "dist/${{ matrix.binary }}" "${{ matrix.platform }}" --version "$version"

  release:
    needs: smoke
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # gh is preinstalled on the runners; no third-party action in the
      # release path.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" --generate-notes dist/*
