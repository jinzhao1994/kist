name: Accept visual baselines

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Reviewed Visual run on current main (all screenshots must have completed)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: visual-accept-main
  cancel-in-progress: false

jobs:
  accept:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Validate source run and current main
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const { validateRun } = await import(`${process.env.GITHUB_WORKSPACE}/web/scripts/visual-artifacts.mjs`);
            const id = process.env.SOURCE_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Invalid run ID');
            const repo = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: id });
            const { data: workflow } = await github.rest.actions.getWorkflow({ ...repo, workflow_id: 'visual.yml' });
            const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            if (branch.commit.sha !== context.sha) throw new Error('Main advanced after dispatch');
            validateRun(run, { repository: `${repo.owner}/${repo.repo}`, sha: context.sha, workflowId: workflow.id });
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...repo, run_id: id });
            const matches = artifacts.filter(a => a.name === `visual-candidate-${run.run_attempt}` && !a.expired);
            if (matches.length !== 1 || matches[0].size_in_bytes > 100000000) throw new Error('Missing, expired, ambiguous or oversized candidate');
            core.setOutput('artifact_id', String(matches[0].id));
            core.setOutput('sha', run.head_sha);
            core.setOutput('attempt', String(run.run_attempt));
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          path: ${{ runner.temp }}/visual-candidate
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Validate reviewed candidate and update reference
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node web/scripts/visual-artifacts.mjs accept "$RUNNER_TEMP/visual-candidate"
      - name: Commit reference without overwriting newer work
        id: commit
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/visual/baseline.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "更新已审阅的页面视觉基准提交（运行 $SOURCE_RUN_ID）"
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch both explicitly.
      - name: Rerun full CI and visual comparison
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const workflow_id of ['ci.yml', 'visual.yml', 'secrets.yml']) {
              await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id, ref: 'main' });
            }
            await core.summary.addHeading('Baselines accepted')
              .addRaw('The reviewed commit reference is saved; no PNG files are committed. CI, Visual and Secret scan were explicitly dispatched; inspect both runs before considering this change complete.').write();
