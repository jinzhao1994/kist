name: Visual

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Resolve approved revision (PRs use their base branch reference)
        id: baseline
        env:
          REFERENCE_REVISION: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node web/scripts/visual-artifacts.mjs resolve "$REFERENCE_REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: .visual-baseline
          persist-credentials: false
      - run: npm --prefix .visual-baseline/web ci
      - run: npm --prefix .visual-baseline/web run build
      - run: CGO_ENABLED=0 go build -o bin/kist ./cmd/kist
        working-directory: .visual-baseline
      - run: npm --prefix web run build
      - run: CGO_ENABLED=0 go build -o bin/kist ./cmd/kist
      - name: Capture in pinned Linux Chromium environment
        run: |
          image=$(node -p 'require("./web/visual/environment.json").image')
          for side in baseline candidate; do
            docker run --rm --ipc=host --platform linux/amd64 \
              -v "$PWD:/work" -w /work/web -e CI=true \
              "$image" node scripts/visual-capture.mjs "$side"
          done
      - name: Validate complete candidate
        id: candidate
        run: |
          node web/scripts/visual-artifacts.mjs prepare baseline
          node web/scripts/visual-artifacts.mjs prepare candidate
      - name: Compare freshly captured approved and current revisions
        run: node web/scripts/visual-artifacts.mjs compare
      - name: Upload candidate
        id: upload-candidate
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-candidate-${{ github.run_attempt }}
          path: web/visual-results/candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Upload report and failure traces
        id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-report-${{ github.run_attempt }}
          path: |
            web/visual-results/report/
            web/visual-results/test-results/
            web/visual-results/baseline/capture.json
            web/visual-results/candidate/capture.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize
        if: ${{ !cancelled() }}
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          CANDIDATE_URL: ${{ steps.upload-candidate.outputs.artifact-url }}
        run: |
          if [ -f web/visual-results/summary.md ]; then
            cat web/visual-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Capture failed; no candidate can be accepted. Inspect test results and traces.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Report: $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $CANDIDATE_URL" >> "$GITHUB_STEP_SUMMARY"
